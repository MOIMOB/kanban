<div class="fixed inset-0 bg-black/30 flex items-center justify-center z-20" (click)="closed.emit()">
  <div class="bg-surface rounded-2xl p-6 w-full max-w-md" (click)="$event.stopPropagation()">
    <h2 class="font-display text-sm font-semibold text-ink mb-4">
      {{ isEdit ? 'Edit category' : 'Create category' }}
    </h2>

    <label class="block text-xs font-medium text-ink-soft mb-1">Name</label>
    <div class="flex gap-2 mb-4">
      <input
        type="color"
        class="h-9 w-9 shrink-0 rounded-md border border-border bg-surface p-1"
        name="categoryColor"
        [(ngModel)]="color"
      />
      <input
        class="flex-1 min-w-0 rounded-md border border-border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent bg-surface text-ink"
        placeholder="Category name"
        name="categoryName"
        [(ngModel)]="name"
      />
    </div>

    @if (error()) {
      <p class="text-sm text-red-600 dark:text-red-400 mb-4">{{ error() }}</p>
    }

    <div class="flex justify-between">
      @if (isEdit) {
        <button
          type="button"
          class="text-sm text-red-600 dark:text-red-400"
          [disabled]="saving()"
          (click)="requestDelete()"
        >
          Delete category
        </button>
      } @else {
        <span></span>
      }
      <div class="flex gap-2">
        <button class="text-sm text-ink-soft hover:text-ink px-3 py-1.5" [disabled]="saving()" (click)="closed.emit()">
          Cancel
        </button>
        <button
          class="text-sm bg-accent hover:bg-accent-dark transition-colors text-white rounded-md px-4 py-1.5 disabled:opacity-50"
          [disabled]="saving()"
          (click)="save()"
        >
          {{ saving() ? 'Saving…' : isEdit ? 'Save' : 'Create category' }}
        </button>
      </div>
    </div>
  </div>
</div>
