@if (loadingIndicator.visible()) {
  <div class="fixed top-0 inset-x-0 z-50 h-0.5 overflow-hidden bg-transparent">
    <div
      class="h-full w-1/3 bg-accent rounded-full"
      style="animation: top-loading-slide 0.7s ease-in-out infinite"
    ></div>
  </div>
}

<div class="flex min-h-screen bg-paper">
  <aside
    class="hidden sm:flex shrink-0 border-r border-paper-2 bg-surface flex-col p-3 transition-[width] duration-150"
    [class.w-56]="!collapsed()"
    [class.w-16]="collapsed()"
  >
    @if (collapsed()) {
      <div class="flex flex-col items-center gap-2 mb-6">
        <span class="h-2.5 w-2.5 rounded-full bg-accent"></span>
        <button
          type="button"
          class="rounded-md p-1.5 text-ink-soft hover:text-ink hover:bg-paper-2/70 transition-colors"
          title="Expand menu"
          (click)="toggleCollapsed()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <polyline points="13 17 18 12 13 7" />
            <polyline points="6 17 11 12 6 7" />
          </svg>
        </button>
      </div>
    } @else {
      <div class="flex items-center justify-between px-1 mb-6">
        <div class="flex items-center gap-2">
          <span class="h-2.5 w-2.5 rounded-full bg-accent"></span>
          <span class="font-display text-lg font-semibold text-ink tracking-tight">Kanban</span>
        </div>
        <button
          type="button"
          class="rounded-md p-1.5 text-ink-soft hover:text-ink hover:bg-paper-2/70 transition-colors"
          title="Collapse menu"
          (click)="toggleCollapsed()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <polyline points="11 17 6 12 11 7" />
            <polyline points="18 17 13 12 18 7" />
          </svg>
        </button>
      </div>
    }

    <nav class="flex flex-col gap-1">
      <a
        routerLink="/boards"
        routerLinkActive
        #boardsLink="routerLinkActive"
        [title]="collapsed() ? 'Boards' : ''"
        class="flex items-center gap-2 rounded-md px-2 py-1.5 text-sm hover:text-ink hover:bg-paper-2/70 transition-colors"
        [class.justify-center]="collapsed()"
        [class.bg-paper-2]="boardsLink.isActive"
        [class.text-ink]="boardsLink.isActive"
        [class.text-ink-soft]="!boardsLink.isActive"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0">
          <rect x="3" y="5" width="5" height="14" rx="1" />
          <rect x="9.5" y="5" width="5" height="9" rx="1" />
          <rect x="16" y="5" width="5" height="11" rx="1" />
        </svg>
        @if (!collapsed()) {
          <span>Boards</span>
        }
      </a>
      <a
        routerLink="/categories"
        routerLinkActive
        #categoriesLink="routerLinkActive"
        [title]="collapsed() ? 'Categories' : ''"
        class="flex items-center gap-2 rounded-md px-2 py-1.5 text-sm hover:text-ink hover:bg-paper-2/70 transition-colors"
        [class.justify-center]="collapsed()"
        [class.bg-paper-2]="categoriesLink.isActive"
        [class.text-ink]="categoriesLink.isActive"
        [class.text-ink-soft]="!categoriesLink.isActive"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0">
          <path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" />
          <circle cx="7" cy="7" r="1" fill="currentColor" stroke="none" />
        </svg>
        @if (!collapsed()) {
          <span>Categories</span>
        }
      </a>
    </nav>

    <div class="flex-1"></div>

    <div class="flex flex-col gap-1 pt-3 border-t border-paper-2">
      <button
        type="button"
        [title]="collapsed() ? (theme.dark() ? 'Light mode' : 'Dark mode') : ''"
        class="flex items-center gap-2 rounded-md px-2 py-1.5 text-sm text-ink-soft hover:text-ink hover:bg-paper-2/70 transition-colors"
        [class.justify-center]="collapsed()"
        (click)="theme.toggle()"
      >
        @if (theme.dark()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
        @if (!collapsed()) {
          <span>{{ theme.dark() ? 'Light mode' : 'Dark mode' }}</span>
        }
      </button>
      <button
        type="button"
        [title]="collapsed() ? 'Sign out' : ''"
        class="flex items-center gap-2 rounded-md px-2 py-1.5 text-sm text-ink-soft hover:text-ink hover:bg-paper-2/70 transition-colors text-left"
        [class.justify-center]="collapsed()"
        (click)="signOut()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        @if (!collapsed()) {
          <span>Sign out</span>
        }
      </button>
    </div>
  </aside>

  <div class="flex-1 min-w-0 sm:pb-0" [class.pb-14]="showMobileNav()">
    <router-outlet />
  </div>

  @if (showMobileNav()) {
  <nav class="sm:hidden fixed bottom-0 inset-x-0 z-30 h-14 bg-surface border-t border-paper-2 flex items-stretch">
    <a
      routerLink="/boards"
      routerLinkActive
      #mobileBoardsLink="routerLinkActive"
      class="flex-1 flex flex-col items-center justify-center gap-0.5 text-[11px]"
      [class.text-accent]="mobileBoardsLink.isActive"
      [class.text-ink-soft]="!mobileBoardsLink.isActive"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
        <rect x="3" y="5" width="5" height="14" rx="1" />
        <rect x="9.5" y="5" width="5" height="9" rx="1" />
        <rect x="16" y="5" width="5" height="11" rx="1" />
      </svg>
      Boards
    </a>
    <a
      routerLink="/categories"
      routerLinkActive
      #mobileCategoriesLink="routerLinkActive"
      class="flex-1 flex flex-col items-center justify-center gap-0.5 text-[11px]"
      [class.text-accent]="mobileCategoriesLink.isActive"
      [class.text-ink-soft]="!mobileCategoriesLink.isActive"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
        <path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" />
        <circle cx="7" cy="7" r="1" fill="currentColor" stroke="none" />
      </svg>
      Categories
    </a>
    <button
      type="button"
      class="flex-1 flex flex-col items-center justify-center gap-0.5 text-[11px] text-ink-soft"
      (click)="theme.toggle()"
    >
      @if (theme.dark()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        Light
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        Dark
      }
    </button>
    <button
      type="button"
      class="flex-1 flex flex-col items-center justify-center gap-0.5 text-[11px] text-ink-soft"
      (click)="signOut()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      Sign out
    </button>
  </nav>
  }
</div>
