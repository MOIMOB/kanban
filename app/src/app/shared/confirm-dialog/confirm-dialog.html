<div class="fixed inset-0 bg-black/30 flex items-center justify-center z-40" (click)="closed.emit()">
  <div class="bg-surface rounded-2xl p-6 w-full max-w-sm" (click)="$event.stopPropagation()">
    <h2 class="font-display text-sm font-semibold text-ink mb-2">{{ title }}</h2>
    <p class="text-sm text-ink-soft mb-6">{{ message }}</p>
    <div class="flex justify-end gap-2">
      <button class="text-sm text-ink-soft hover:text-ink px-3 py-1.5" [disabled]="busy" (click)="closed.emit()">
        Cancel
      </button>
      <button
        class="text-sm text-white rounded-md px-4 py-1.5 transition-colors disabled:opacity-50"
        [class]="danger ? 'bg-red-600 hover:bg-red-700' : 'bg-accent hover:bg-accent-dark'"
        [disabled]="busy"
        (click)="confirmed.emit()"
      >
        {{ busy ? 'Working…' : confirmLabel }}
      </button>
    </div>
  </div>
</div>
